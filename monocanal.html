  [ // Conceptual
    "Collage de información reconfigurada.",
    "La cámara es un lector torpe:",
    "traduce textura en dato, dato en eco.",
    "El código escribe una versión del polvo.",
    "La enciclopedia se disuelve en algoritmos.",
    "Leer es mapear, trazar, equivocarse.",
    "Cada dato es una grieta del saber.",
    "El sentido se corta en líneas rectas.",
    "El collage se comporta como un sistema.",
    "La poética se filtra por error."
  ],
  [ // Arqueología mínima
    "La máquina se encuentra con su propio pasado.",
    "En cada zumbido: imprenta, fax, escáner.",
    "El tiempo se imprime otra vez.",
    "El presente vibra con residuos del ayer.",
    "El collage respira mecánicamente.",
    "La historia se vuelve ruido blanco.",
    "La copia es también una excavación.",
    "Cada trazo digitaliza un silencio.",
    "El motor excava en papel.",
    "La máquina recuerda sin nostalgia."

];

const contenedor = document.getElementById("contenedor");

// crear 10 líneas visibles
const lineas = [];
for (let i = 0; i < 10; i++) {
  const div = document.createElement("div");
  div.className = "linea";
  contenedor.appendChild(div);
  lineas.push(div);
}

// función para mostrar una “versión” completa
function mostrarFila(fila) {
  for (let i = 0; i < 10; i++) {
    lineas[i].textContent = textos[fila][i];
  }
}

// inicializa con una versión al azar
let filaActual = Math.floor(Math.random() * textos.length);
mostrarFila(filaActual);

// cada 1.5 segundos cambia una línea aleatoria
setInterval(() => {
  const lineaCambiar = Math.floor(Math.random() * 10);
  const nuevaFila = Math.floor(Math.random() * textos.length);
  lineas[lineaCambiar].style.opacity = 0;
  setTimeout(() => {
    lineas[lineaCambiar].textContent = textos[nuevaFila][lineaCambiar];
    lineas[lineaCambiar].style.opacity = 1;
  }, 400);
}, 200);</script></p><div class="post__iframe"><iframe loading="lazy" width="560" height="315" src="https://www.youtube.com/embed/1juUM4xd-hg?si=FkDe63Im--G5UEvU" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen="allowfullscreen"></iframe></div><p> </p><p style="display: none !important;">La máquina se encuentra con su propio pasado. En cada zumbido: imprenta, fax, escáner.El presente vibra, el collage respira mecánicamente. La máquina recuerda ¿sin nostalgia?.</p></div></div><footer class="content__footer"><div class="entry-wrapper"></div><nav class="content__nav"><div class="wrapper"><div class="content__nav-inner"><div class="content__nav-prev"><a href="https://carlosdaniellescano.github.io/escp/instalado.html" class="content__nav-link" rel="prev"><figure class="content__nav-image"><img src="https://carlosdaniellescano.github.io/escp/media/posts/7/responsive/IMG_3322-xs.png" class="lazyload" loading="lazy" alt="" height="3546" width="3546"></figure><div><span>Previous</span> Instalado</div></a></div><div class="content__nav-next"><a href="https://carlosdaniellescano.github.io/escp/duo.html" class="content__nav-link" rel="next"><div><span>Next</span> Colectivas en Vivo</div><figure class="content__nav-image"><img src="https://carlosdaniellescano.github.io/escp/media/posts/5/responsive/Capture18-xs.PNG" class="lazyload" loading="lazy" alt="" height="333" width="333"></figure></a></div></div></div></nav></footer></article><div class="banner banner--after-content"><div class="wrapper"><div id="containersss"></div><script>const chars = "  --__,,==++!!**ssllvv))((||ii[]{}II[//FFAANNZZINNE//DDIIGGIITTAALL//EESSCC//PP//@@";
const numLines = 15;
const lineLength = 40; // cantidad fija de caracteres
const container = document.getElementById('containersss');

// Inicializamos las líneas
let lines = [];
for (let i = 0; i < numLines; i++) {
    let arr = [];
    for (let j = 0; j < lineLength; j++) {
        arr.push(chars[Math.floor(((j+i) /lineLength) * chars.length)+i*4]);
    }
    lines.push(arr);

    // Creamos el div correspondiente
    const div = document.createElement('div');

    div.textContent = arr.join('');
    container.appendChild(div);
}

// Función para actualizar las líneas (loop de caracteres)
function updateLines() {
    lines.forEach((arr, i) => {
        let last = arr.pop();
        arr.unshift(last);
        container.children[i].textContent = arr.join('');
    });
}

// Actualizamos cada 100ms
setInterval(updateLines, 100);</script></div></div></main><footer class="footer"><div class="wrapper"><div class="footer__copyright"><p>Más data en <a href="https://www.lescano.ar" target="_blank" rel="noopener">lescano.ar</a></p></div><button id="backToTop" class="footer__bttop" aria-label="Back to top" title="Back to top"><svg width="20" height="20"><use xlink:href="https://carlosdaniellescano.github.io/escp/assets/svg/svg-map.svg#toparrow"/></svg></button></div></footer><script defer="defer" src="https://carlosdaniellescano.github.io/escp/assets/js/scripts.min.js?v=700105c316933a8202041b6415abb233"></script><script>window.publiiThemeMenuConfig={mobileMenuMode:'sidebar',animationSpeed:300,submenuWidth: 'auto',doubleClickTime:500,mobileMenuExpandableSubmenus:true,relatedContainerForOverlayMenuSelector:'.top'};</script><script>var images = document.querySelectorAll('img[loading]');
